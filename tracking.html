<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traccia il tuo ordine | Completini Squadre Calcio</title>
<meta name="description" content="Inserisci il codice del tuo ordine per vedere lo stato e il tracking della spedizione.">
<link rel="icon" href="https://completinicalcio.it/logo.jpg">
<link rel="manifest" href="/manifest-tracking.json">
<meta name="theme-color" content="#050d1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Il mio ordine">
<link rel="apple-touch-icon" href="/icona-192.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Stessa palette del catalogo (index.html): blu notte + accento #2563eb,
   con passaggio automatico chiaro/scuro come il sito. */
:root{
  --bg:#050d1c;--panel:#0a1628;--panel2:#0f1e36;
  --line:rgba(232,237,245,.09);--text:#e8edf5;--muted:#8a98b4;
  --volt:#2563eb;--radius:20px;
  --bg-rgb:5,13,28;--fg-rgb:232,237,245;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef2f8;--panel:#ffffff;--panel2:#dde6f5;
  --line:rgba(10,30,70,.10);--text:#0d1829;--muted:#4a5a7a;
  --bg-rgb:238,242,248;--fg-rgb:13,24,41;
}}
:root[data-theme="dark"]{--bg:#050d1c;--panel:#0a1628;--panel2:#0f1e36;--line:rgba(232,237,245,.09);--text:#e8edf5;--muted:#8a98b4;--bg-rgb:5,13,28;--fg-rgb:232,237,245;}
:root[data-theme="light"]{--bg:#eef2f8;--panel:#ffffff;--panel2:#dde6f5;--line:rgba(10,30,70,.10);--text:#0d1829;--muted:#4a5a7a;--bg-rgb:238,242,248;--fg-rgb:13,24,41;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}
img{display:block}

header{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);background:rgba(var(--bg-rgb),.78);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:70px;width:min(1100px,92%);margin:0 auto}
.logo{display:flex;align-items:center;gap:12px;font-weight:800}
.logo-mark{width:42px;height:42px;border-radius:11px;object-fit:cover;background:var(--panel2);border:1px solid var(--line)}
.logo b{display:block;font-size:15px;font-weight:800;line-height:1.2}
.logo small{display:block;font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.back{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;transition:color .15s}
.back:hover{color:var(--text)}

main{width:min(580px,92%);margin:0 auto;padding:60px 0 100px}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--volt);border:1px solid rgba(37,99,235,.35);padding:8px 16px;border-radius:999px;margin-bottom:24px;background:rgba(37,99,235,.06)}
h1{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:clamp(30px,6vw,46px);line-height:.95;margin-bottom:14px}
.lead{color:var(--muted);font-size:15px;line-height:1.6;margin-bottom:36px}

/* SEARCH */
.search-wrap{display:flex;gap:10px;margin-bottom:40px;flex-wrap:wrap}
.search-wrap input{flex:1;min-width:200px;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;color:var(--text);font-size:15px;font-weight:600;outline:none;transition:border-color .2s;font-family:'Inter',sans-serif}
.search-wrap input:focus{border-color:var(--volt)}
.search-wrap input::placeholder{color:var(--muted);font-weight:400}
.search-wrap button{padding:15px 24px;background:var(--volt);color:#fff;border:none;border-radius:14px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;transition:opacity .15s;font-family:'Inter',sans-serif}
.search-wrap button:hover{opacity:.88}

/* CARD */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.card-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.order-code{font-family:'Archivo Black',sans-serif;font-size:19px;text-transform:uppercase;flex:1;letter-spacing:.03em}
.pill{padding:5px 14px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pill-lavorazione{background:rgba(255,180,0,.15);color:#ffb400}
.pill-spedito{background:rgba(37,99,235,.15);color:var(--volt)}
.pill-consegnato{background:rgba(40,200,100,.15);color:#28c864}

/* STEPS */
.steps-wrap{padding:24px 24px 20px;border-bottom:1px solid var(--line)}
.steps-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.steps{display:flex;align-items:flex-start}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.step-line{position:absolute;top:13px;left:50%;right:-50%;height:2px;background:var(--line);z-index:0;overflow:hidden}
.step-line-fill{position:absolute;inset:0;background:var(--volt);transform-origin:left;transform:scaleX(0);transition:transform 1s cubic-bezier(.4,0,.2,1)}
.step:last-child .step-line{display:none}
.step.done .step-line-fill{transform:scaleX(1)}
.step.active .step-line-fill{transition:transform 1.4s cubic-bezier(.4,0,.2,1)}
.step-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;z-index:1;position:relative;transition:all .3s}
.step.done .step-dot{background:var(--volt);border-color:var(--volt);color:#fff;font-weight:800}
.step.active .step-dot{background:rgba(37,99,235,.12);border-color:var(--volt);color:var(--volt);box-shadow:0 0 0 4px rgba(37,99,235,.12);animation:pulse-dot 2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 3px rgba(37,99,235,.2);background:rgba(37,99,235,.12)}50%{box-shadow:0 0 0 10px rgba(37,99,235,.3),0 0 20px rgba(37,99,235,.2);background:rgba(37,99,235,.25)}}
.step-lbl{font-size:9.5px;font-weight:600;color:var(--muted);text-align:center;margin-top:7px;line-height:1.3;max-width:60px}
.step.done .step-lbl,.step.active .step-lbl{color:var(--text)}
.step-eta{font-size:9px;font-weight:700;color:var(--volt);margin-top:3px;text-align:center;max-width:60px;line-height:1.3}
/* PROGRESS BAR */
.progress-wrap{margin-top:16px}
.progress-track{height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--volt),#60a5fa);border-radius:999px;transform-origin:left;transform:scaleX(0);transition:transform 1.2s cubic-bezier(.4,0,.2,1)}
.progress-pct{font-size:10px;font-weight:700;color:var(--muted);margin-top:6px;text-align:right}

/* INFO */
.info-row{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap}
.info-item{flex:1;min-width:110px}
.info-item label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.info-item span{font-size:13.5px;font-weight:700}

/* ETA BANNER */
.eta-banner{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:rgba(37,99,235,.06)}
.eta-icon{font-size:20px;flex-shrink:0}
.eta-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.eta-value{font-size:16px;font-weight:800;color:var(--volt)}

/* TRACKING BTN */
.track-section{padding:18px 24px;border-bottom:1px solid var(--line)}
.track-section + .track-section{border-top:none}
.btn-track{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;background:var(--volt);color:#fff;border-radius:999px;font-weight:800;font-size:14px;transition:opacity .15s}
.btn-track:hover{opacity:.88}
.track-num{margin-top:8px;font-size:12.5px;color:var(--muted);font-family:monospace;letter-spacing:.04em}

/* GLOSSARIO */
.glossario{margin-top:32px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.glossario-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.glossario-head-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.glossario-chevron{font-size:14px;color:var(--muted);transition:transform .25s}
.glossario-head[aria-expanded="true"] .glossario-chevron{transform:rotate(180deg)}
.glossario-body{display:none;padding:4px 0 8px}
.glossario-body.open{display:block}
.gl-row{display:flex;gap:12px;align-items:flex-start;padding:10px 20px}
.gl-row+.gl-row{border-top:1px solid var(--line)}
.gl-icon{font-size:16px;flex-shrink:0;width:22px;text-align:center;margin-top:1px}
.gl-term{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.gl-desc{font-size:12px;color:var(--muted);line-height:1.5}

/* FOTO */
.foto-section{padding:18px 24px}
.foto-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.foto-featured{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:1px solid var(--line);cursor:zoom-in;transition:opacity .15s;margin-bottom:8px}
.foto-featured:hover{opacity:.88}
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.foto-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;transition:opacity .15s}
.foto-grid img:hover{opacity:.8}

/* IN LAVORAZIONE BANNER */
.lavorazione-banner{padding:16px 24px;background:rgba(100,130,255,.08);border-bottom:1px solid rgba(100,130,255,.2);display:flex;align-items:flex-start;gap:14px}
.lavorazione-banner-icon{font-size:24px;flex-shrink:0;margin-top:2px}
.lavorazione-banner-title{font-size:13px;font-weight:800;color:#8fa8ff;margin-bottom:4px}
.lavorazione-banner-sub{font-size:12px;color:var(--muted);line-height:1.6}

/* FUMETTO DEL PACCO: messaggio simpatico che cambia col viaggio */
.pacco-dice{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 14px;background:rgba(var(--fg-rgb),.04);border:1px solid var(--line);border-radius:14px}
.pacco-dice-emoji{font-size:22px;flex-shrink:0;animation:pacco-molla 2.6s ease-in-out infinite}
.pacco-dice-txt{font-size:12.5px;font-weight:600;line-height:1.45}
@keyframes pacco-molla{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.pacco-dice-emoji{animation:none}}

/* PASSAGGIO AL CORRIERE ITALIANO: avvisa che la sosta è normale */
/* AVVISAMI: iscrizione alle notifiche + istruzioni per il cliente */
/* sta DENTRO la scheda, subito sotto lo stato: è la prima cosa utile che il
   cliente vede, prima era in fondo dopo le foto e passava inosservato */
/* Una riga sola e discreta: la tracciatura deve restare la protagonista.
   Le istruzioni compaiono solo se il cliente tocca il pulsante. */
.avvisami{border-bottom:1px solid var(--line)}
.avvisami-top{padding:11px 24px;display:flex;align-items:center;gap:10px}
.avvisami-emoji{font-size:16px;flex-shrink:0}
.avvisami-txt{flex:1;min-width:0}
.avvisami-tit{font-size:12.5px;font-weight:700;color:var(--muted)}
.avvisami-btn{padding:7px 15px;background:transparent;color:var(--volt);border:1.5px solid var(--volt);border-radius:999px;font-weight:800;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap}
.avvisami-btn:hover{background:var(--volt);color:#fff}
.avvisami-btn:hover{opacity:.88}
.avvisami-btn.attivo{background:rgba(40,200,100,.16);color:#28c864}
.avvisami-btn:disabled{opacity:.6;cursor:default}
.avvisami-guida{border-top:1px solid var(--line);padding:14px 24px;font-size:12.5px;line-height:1.7;color:var(--muted);display:none}
.avvisami-guida.open{display:block}
.avvisami-guida b{color:var(--text)}
.avvisami-guida ol{margin:6px 0 0 18px}
.avvisami-guida li{margin-bottom:4px}
.avvisami-link{color:var(--volt);font-weight:700;cursor:pointer;font-size:12px;background:none;border:none;padding:0;font-family:'Inter',sans-serif;text-decoration:underline}

.attesa-banner{padding:16px 24px;background:rgba(255,180,0,.10);border-bottom:1px solid rgba(255,180,0,.28);display:flex;align-items:flex-start;gap:14px}
.attesa-banner-icon{font-size:24px;flex-shrink:0;margin-top:2px}
.attesa-banner-title{font-size:13px;font-weight:800;color:#e0a800;margin-bottom:4px}
.attesa-banner-sub{font-size:12px;color:var(--muted);line-height:1.6}

/* CONSEGNA TENTATA / GIACENZA */
.mancata-banner{padding:16px 24px;background:rgba(255,90,60,.10);border-bottom:1px solid rgba(255,90,60,.30);display:flex;align-items:flex-start;gap:14px}
.mancata-banner-icon{font-size:24px;flex-shrink:0;margin-top:2px}
.mancata-banner-title{font-size:13px;font-weight:800;color:#e2603f;margin-bottom:4px}
.mancata-banner-sub{font-size:12px;color:var(--muted);line-height:1.6}

/* IN CONSEGNA BANNER */
.consegna-banner{padding:16px 24px;background:linear-gradient(135deg,rgba(255,140,0,.18),rgba(255,180,0,.10));border-bottom:1px solid rgba(255,150,0,.3);display:flex;align-items:center;gap:14px}
.consegna-banner-icon{font-size:28px;flex-shrink:0;animation:truck 1.2s ease-in-out infinite alternate}
@keyframes truck{from{transform:translateX(0)}to{transform:translateX(6px)}}
.consegna-banner-title{font-size:14px;font-weight:800;color:#ffaa00;margin-bottom:2px}
.consegna-banner-sub{font-size:12px;color:var(--muted);line-height:1.4}

/* ERRORE */
.err-card{background:rgba(255,70,70,.07);border:1px solid rgba(255,70,70,.22);border-radius:var(--radius);padding:28px;text-align:center}
.err-card h3{font-size:16px;font-weight:800;color:#ff7070;margin-bottom:8px}
.err-card p{color:var(--muted);font-size:14px;line-height:1.6}

/* CINA TIMELINE */
.cina-section{padding:18px 24px;border-bottom:1px solid var(--line)}
.cina-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.ev-list{display:flex;flex-direction:column;gap:0}
.ev-row{display:flex;gap:12px;position:relative;padding-bottom:14px}
.ev-row:last-child{padding-bottom:0}
.ev-row:not(:last-child)::before{content:'';position:absolute;left:7px;top:18px;bottom:0;width:1px;background:var(--line)}
.ev-dot{width:15px;height:15px;border-radius:50%;background:rgba(37,99,235,.18);border:2px solid var(--volt);flex-shrink:0;margin-top:2px}
.ev-dot-first{background:var(--volt)}
.ev-body{flex:1}
.ev-stato{font-size:13px;font-weight:700;color:var(--text);line-height:1.4}
.ev-meta{font-size:11px;color:var(--muted);margin-top:2px}

/* LIGHTBOX */
.lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:92vh;object-fit:contain;border-radius:12px}

footer{border-top:1px solid var(--line);padding:28px 0;text-align:center;font-size:13px;color:var(--muted)}
footer a{color:var(--volt);font-weight:700}

@media(max-width:440px){
  .step-lbl{font-size:8.5px;max-width:48px}
  .step-dot{width:22px;height:22px;font-size:10px}
  .step-line{top:11px}
}
</style>
</head>
<body>
<header>
  <nav class="nav">
    <a class="logo" href="https://completinicalcio.it">
      <img class="logo-mark" src="https://completinicalcio.it/logo.jpg" alt="logo">
      <div><b>Completini SC 2.0</b><small>Maglie & Kit Calcio</small></div>
    </a>
    <a class="back" href="https://completinicalcio.it">← Catalogo</a>
  </nav>
</header>

<main>
  <div class="eyebrow">📦 Tracking ordine</div>
  <h1>Dov'è il tuo<br><span style="color:var(--volt)">pacco?</span></h1>
  <p class="lead">Inserisci il codice ordine ricevuto su WhatsApp (es. <strong>CSC-2026-0274</strong>)</p>

  <div class="search-wrap">
    <input type="text" id="inp" placeholder="CSC-2026-0274" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button onclick="cerca()">Traccia →</button>
  </div>

  <div id="benvenutoApp"></div>
  <div id="result"></div>

  <div class="glossario" style="display:none">
    <div class="glossario-head" aria-expanded="false" onclick="toggleGlossario(this)">
      <span class="glossario-head-lbl">📖 Cosa significano le voci del tracking?</span>
      <span class="glossario-chevron">▼</span>
    </div>
    <!-- Riempito da JS: solo le voci presenti nel tracking di questo ordine -->
    <div class="glossario-body"></div>
  </div>
</main>

<div class="lb" id="lb" onclick="this.classList.remove('open')">
  <img id="lbImg" src="" alt="">
</div>

<footer>
  <div>© 2025 Completini Squadre Calcio 2.0 · <a href="https://completinicalcio.it">Catalogo</a> · Aiuto: <a href="https://wa.me/447727750265">WhatsApp</a></div>
</footer>

<script>
const STEPS = [
  {lbl:"Ordine\nricevuto", icon:"✓"},
  {lbl:"In\nlavorazione", icon:"⚙"},
  {lbl:"Spedito",         icon:"📦"},
  {lbl:"In\nconsegna",   icon:"🚚"},
  {lbl:"Consegnato",     icon:"🏠"},
];

function statoIndex(s){
  if(!s) return 0;
  s = s.toLowerCase();
  if(s==="consegnato")  return 4;
  if(s==="in_consegna") return 3;
  if(s==="spedito")     return 2;
  return 1; // in_lavorazione o altro
}

function trackingUrl(corriere, num){
  const c = (corriere||"").toLowerCase();
  if(c.includes("poste"))
    return `https://www.poste.it/cerca/index.html#/risultati-spedizioni/${num}`;
  if(c.includes("dhl"))
    return `https://www.dhl.com/it-it/home/tracking/tracking-parcel.html?submit=1&tracking-id=${num}`;
  return `https://t.17track.net/it#nums=${num}`;
}

function corriereLogo(corriere){
  const c=(corriere||"").toLowerCase();
  if(c.includes("poste")) return "📮";
  if(c.includes("dhl"))   return "🟡";
  return "📦";
}

function normCodice(raw){
  raw = raw.trim().toUpperCase().replace(/\s/g,"");
  if(/^CSC-\d{4}-\d{4}$/.test(raw)) return raw;
  const num = raw.replace(/[^0-9]/g,"");
  if(num){
    const anno = new Date().getFullYear();
    return `CSC-${anno}-${num.padStart(4,"0")}`;
  }
  return raw;
}

function fmtData(d){
  if(!d) return "";
  const p=d.split("-");
  return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : d;
}

async function cerca(){
  const raw = document.getElementById("inp").value;
  if(!raw.trim()){ document.getElementById("inp").focus(); return; }
  const cod = normCodice(raw);
  const r = document.getElementById("result");
  r.innerHTML = `<p style="text-align:center;color:var(--muted);padding:20px 0">Ricerca in corso…</p>`;
  let data;
  try{
    const resp = await fetch("tracking.json?t="+Date.now());
    data = await resp.json();
  }catch(e){
    r.innerHTML = errCard("Errore di connessione","Riprova tra qualche secondo.");
    return;
  }
  const o = data[cod];
  if(!o){
    r.innerHTML = errCard("Ordine non trovato",`Il codice <strong>${cod}</strong> non è nel sistema.<br>Controlla il messaggio WhatsApp o <a href="https://wa.me/447727750265" style="color:var(--volt)">scrivici</a>.`);
    aggiornaGlossario(null);
    return;
  }
  _codiceCorrente = cod;
  try{ localStorage.setItem("csc_ultimo_ordine", cod); }catch(e){}

  // Il file pubblicato lo aggiorna il Mac. Il servizio online invece controlla
  // i corrieri ogni mezz'ora anche a Mac spento: se ha movimenti piu recenti,
  // li usiamo noi. Cosi il cliente vede sempre l'ultima novita.
  try{
    const fresco = await fetch(API_NOTIFICHE + "/t/" + encodeURIComponent(cod))
      .then(r => r.ok ? r.json() : null).catch(() => null);
    if(fresco && fresco.ok){
      const piuRecente = (a, b) => {
        const da = (a && a.length) ? a[0].data || "" : "";
        const db2 = (b && b.length) ? b[0].data || "" : "";
        return db2 > da ? b : a;
      };
      o.eventi_corriere = piuRecente(o.eventi_corriere, fresco.eventi);
      o.eventi_cina     = piuRecente(o.eventi_cina, fresco.eventi_fornitore);
    }
  }catch(e){}
  const benv = document.getElementById("benvenutoApp");
  if(benv) benv.innerHTML = "";   // trovato l'ordine: il messaggio di benvenuto non serve più
  r.innerHTML = buildCard(cod, o);
  aggiornaGlossario(o);
  statoAvvisi();
  // Anima barra progress e line-fill dopo render
  // Due rAF: primo = paint iniziale, secondo = applica transform → browser vede diff → transition scatta
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const fill = r.querySelector(".progress-fill");
    if(fill){ void fill.getBoundingClientRect(); const p = fill.dataset.pct/100; fill.style.transform=`scaleX(${p})`; }
    // Riempi solo le linee delle tappe già superate: prima venivano colorate
    // TUTTE, così un pacco appena spedito sembrava già in consegna (31/08/26).
    r.querySelectorAll(".step").forEach(step=>{
      const el = step.querySelector(".step-line-fill");
      if(!el) return;
      void el.getBoundingClientRect();
      el.style.transform = step.classList.contains("done") ? "scaleX(1)" : "scaleX(0)";
    });
  }));
}

function aggiungiGiorniLavorativi(dataStr, giorni){
  // dataStr: "2026-08-13 19:47:36" o "2026-08-13"
  const d = new Date(dataStr.substring(0,10));
  if(isNaN(d)) return null;
  let aggiunti = 0;
  while(aggiunti < giorni){
    d.setDate(d.getDate()+1);
    const dw = d.getDay(); // 0=dom,6=sab
    if(dw !== 0 && dw !== 6) aggiunti++;
  }
  const mesi = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  return `${d.getDate()} ${mesi[d.getMonth()]}`;
}

function giorniLavorativi(dataStr){
  if(!dataStr) return null;
  const start = new Date(dataStr.substring(0,10)+"T00:00:00");
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  if(isNaN(start) || start > oggi) return null;
  // Giorni lavorativi TRASCORSI dalla partenza: il giorno della spedizione non
  // si conta (identica alla formula del gestionale, che mostrava 11 mentre qui
  // ne uscivano 12 — 31/08/26).
  let giorni = 0;
  const cur = new Date(start);
  while(cur < oggi){
    cur.setDate(cur.getDate()+1);
    const g = cur.getDay();
    if(g !== 0 && g !== 6) giorni++;
  }
  return giorni;
}

function estraiEta(eventi){
  // +15 giorni lavorativi dal PRIMO movimento in assoluto, cioè da quando il
  // pacco si è mosso in Cina: i tempi di consegna partono da lì.
  // Prima si prendeva l'ultimo elemento della lista unita: essendo ogni lista
  // ordinata dal più recente, quello era il movimento più vecchio di POSTE,
  // e la data prevista risultava molto più in là del dovuto (31/08/26).
  const date = (eventi || []).map(e => (e && e.data) ? String(e.data).slice(0,10) : "")
                             .filter(Boolean).sort();
  if(!date.length) return null;
  return aggiungiGiorniLavorativi(date[0], 15);
}

function calcolaPercento(idx, eventi){
  // Percentuale basata su step (0-100) con granularità sugli eventi cina
  const base = [0, 15, 35, 75, 100];
  if(idx >= 4) return 100;
  let pct = base[idx];
  // Raffina in base agli ultimi eventi cina
  const keywords = [
    {k:"informazioni elettroniche ricevute",  bonus: 2},
    {k:"arrivato al punto di raccolta",       bonus: 4},
    {k:"pacco in uscita dal centro operativo",bonus: 6},
    {k:"uscito dal magazzino",                bonus: 8},
    {k:"caricato sull",                       bonus:10},
    {k:"volo partito",                        bonus:13},
    {k:"volo atterrato",                      bonus:16},
    {k:"sdoganamento",                        bonus:18},
    {k:"consegnato al corriere locale",       bonus:20},
    {k:"inviato al magazzino, in attesa di scansione", bonus:22},
  ];
  let bonus = 0;
  for(const ev of (eventi||[])){
    const s = (ev.stato||"").toLowerCase();
    for(const kw of keywords) if(s.includes(kw.k)) bonus = Math.max(bonus, kw.bonus);
  }
  return Math.min(base[idx] + bonus, base[idx+1] - 1);
}

const _REMAP_STATI = {
  "inviato al magazzino, in attesa di scansione": "Il tuo pacco è in fase di presa in carico da Poste Italiane",
  "inviato al magazzino": "Il tuo pacco è in fase di presa in carico da Poste Italiane",
};
function remapStato(s){
  const sl = s.toLowerCase().trim();
  for(const [k,v] of Object.entries(_REMAP_STATI)) if(sl===k) return v;
  return s;
}
function pulisciStato(s){
  s = s.replace(/[‘’]S LOGISTIC NETWORK/gi,"").replace(/’S LOGISTIC NETWORK/gi,"").trim();
  s = s.replace(/\bIn transitoo\b/gi,"In transito").replace(/\s{2,}/g," ");
  return s;
}
function pulisciLuogo(l){
  if(!l) return "";
  l = String(l).trim();
  // Località che rivelano l'origine cinese: non vanno mostrate al cliente.
  if(/\b(cina|china|guangzhou|shenzhen|shanghai|beijing|pechino|guangdong|hong ?kong)\b/i.test(l)) return "";
  if(/^(cn|hk)$/i.test(l)) return "";
  l = l.replace(/\bCN\b/g,"").replace(/^IT\s+/,"");
  // Sigle aeroportuali → nome comprensibile
  l = l.replace(/^FCO$/i,"Roma Fiumicino").replace(/^MXP$/i,"Milano Malpensa");
  // "dalla sede operativa di CATANIA (CT)" → "Catania (CT)"
  l = l.replace(/^dalla sede operativa di\s+/i,"").replace(/^filiale\s+/i,"");
  // Poste scrive tutto maiuscolo: si legge meglio con l'iniziale grande,
  // lasciando in maiuscolo la sigla della provincia fra parentesi.
  if(l === l.toUpperCase()){
    l = l.toLowerCase().replace(/\b[a-zà-ù]/g, c => c.toUpperCase())
         .replace(/\(([a-z]{2})\)/gi, (m,p) => "("+p.toUpperCase()+")");
  }
  return l.trim().replace(/^[·,\s]+|[·,\s]+$/g,"");
}

  if(o.corriere)        infoItems += `<div class="info-item"><label>Corriere</label><span>${corriereLogo(o.corriere)} ${o.corriere}</span></div>`;

  let trackHtml = "";

  const evCina     = (o.eventi_cina||[]);
  const evCorriere = (o.eventi_corriere||[]);
  const tuttiEv = [...evCorriere, ...evCina].sort((a,b)=>{
    const da = new Date((a.data||"").substring(0,19).replace(" ","T"));
    const db2 = new Date((b.data||"").substring(0,19).replace(" ","T"));
    return db2 - da; // più recente prima
  });
  let cinaHtml = "";
  if(tuttiEv.length){
    const righe = tuttiEv.map((e,i)=>`
      <div class="ev-row">
        <div class="ev-dot${i===0?" ev-dot-first":""}"></div>
        <div class="ev-body">
          <div class="ev-stato">${remapStato(pulisciStato(e.stato||""))}</div>
          <div class="ev-meta">${e.data||""}${(()=>{const L=pulisciLuogo(e.luogo);return L?` · 📍 ${L}`:"";})()}</div>
        </div>
      </div>`).join("");
    cinaHtml = `<div class="cina-section">
      <div class="cina-lbl">📍 Storico spedizione</div>
      <div class="ev-list">${righe}</div>
    </div>`;
  }

  // foto
  const foto = (o.foto||[]).filter(Boolean);
  let fotoHtml = "";
  if(foto.length){
    const openLb = `document.getElementById('lbImg').src=this.src;document.getElementById('lb').classList.add('open')`;
    const featured = `<img class="foto-featured" src="foto_tracking/${foto[0]}" alt="foto merce" loading="lazy" onclick="${openLb}">`;
    const rest = foto.slice(1).map(f=>`<img src="foto_tracking/${f}" alt="foto merce" loading="lazy" onclick="${openLb}">`).join("");
    fotoHtml = `<div class="foto-section"><div class="foto-lbl">📸 Foto merce</div>${featured}${rest ? `<div class="foto-grid">${rest}</div>` : ""}</div>`;

  const lavorazioneBanner = (o.stato === "in_lavorazione" || o.stato === "lavorazione" || o.stato === "attesa_pagamento")
    ? `<div class="lavorazione-banner"><div class="lavorazione-banner-icon">⏳</div><div><div class="lavorazione-banner-title">Il tuo ordine è in preparazione</div><div class="lavorazione-banner-sub">Stiamo raccogliendo la tua merce. Riceverai le foto e il codice tracking non appena il pacco parte, entro 2–3 giorni lavorativi.</div></div></div>`
    : "";

  const consegnaBanner = o.stato === "in_consegna"
    ? `<div class="consegna-banner"><div class="consegna-banner-icon">🚚</div><div><div class="consegna-banner-title">Il tuo pacco è in consegna oggi!</div><div class="consegna-banner-sub">Il corriere è in giro con il tuo ordine. Tieniti pronto.</div></div></div>`
    : "";

  const paccoDice = (()=>{
    const ev = [...(o.eventi_corriere||[]), ...(o.eventi_cina||[])]

    if(o.stato === "consegnato"){
      emoji = "🎉"; frase = "Sono arrivato a casa tua! Buon divertimento in campo ⚽";
    } else if(o.stato === "attesa_pagamento" || o.stato === "in_lavorazione" || o.stato === "lavorazione"){
      emoji = "🧵"; frase = "Mi stanno preparando… ci vediamo prestissimo!";

      emoji = "🚪"; frase = "Sono passato ma non c'eri! Riprovo il prossimo giorno lavorativo.";

  /* Passaggio di consegne al corriere italiano: il tracking resta fermo per
     qualche giorno ed è la fase in cui i clienti si preoccupano di più.

  const attesaBanner = (()=>{
    if(o.stato === "consegnato" || o.stato === "in_consegna") return "";
    const ev = [...(o.eventi_corriere||[]), ...(o.eventi_cina||[])]

      lo registra, qui compaiono i nuovi aggiornamenti.</div></div></div>`;
  })();

  return `<div class="card">

        <div class="progress-pct">${pct}%</div>
      </div>
      ${paccoDice}
      ${(()=>{
        // Si conta dalla data di spedizione (la stessa mostrata in "SPEDITO IL").
        // Prima si prendeva l'ULTIMO elemento della lista eventi unita: essendo
        // ogni lista ordinata dal più recente, quello era l'ultimo evento del
        // corriere italiano — un pacco partito da due settimane risultava
        // "in transito da 1 giorno" (31/08/26).
        const dateEv = [...(o.eventi_cina||[]), ...(o.eventi_corriere||[])]
          .map(e => (e.data||"").slice(0,10)).filter(Boolean);
        const candidate = [(o.data_spedizione||"").slice(0,10), ...dateEv].filter(Boolean).sort();
        const primaData = candidate[0] || o.data_spedizione;
        const gg = o.stato !== "consegnato" ? giorniLavorativi(primaData) : null;
        return gg ? `<div style="margin-top:10px;font-size:11px;font-weight:700;color:var(--muted);text-align:center">📦 In transito da <span style="color:var(--volt)">${gg} giorn${gg===1?"o":"i"} lavorativ${gg===1?"o":"i"}</span></div>` : "";
      })()}
    </div>
    ${(o.stato !== "consegnato" && o.stato !== "annullato") ? bloccoAvvisami(cod) : ""}
    ${infoItems ? `<div class="info-row">${infoItems}</div>` : ""}
    ${(()=>{
      const etaAll = estraiEta([...(o.eventi_cina||[]),...(o.eventi_corriere||[])]);
      return (etaAll && o.stato !== "consegnato")
        ? `<div class="eta-banner"><div class="eta-icon">📅</div><div><div class="eta-label">Data prevista di consegna</div><div class="eta-value">${etaAll}</div></div></div>`
        : "";
    })()}
    ${trackHtml}
    ${cinaHtml}
    ${fotoHtml}
  </div>`;
}

function b64ToUint8(base64){
  const pad = '='.repeat((4 - base64.length % 4) % 4);
  const b64 = (base64 + pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(b64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

function guidaHtml(quale){
  let k = quale;
  if(!k) k = iosNonSafari ? "chromeIos" : (isiOS && !installata ? "safari" : "standard");
  const altra = (k === "standard")
    ? `<button class="avvisami-link" onclick="mostraGuida('safari')">Hai un iPhone? Istruzioni qui</button>`
    : `<button class="avvisami-link" onclick="mostraGuida('standard')">Hai Android o sei da computer? Istruzioni qui</button>`;
  return GUIDE[k] + `<div style="margin-top:10px">${altra}</div>`;
}

function mostraGuida(quale){
  const g = document.querySelector('.avvisami-guida');
  if(g){ g.innerHTML = guidaHtml(quale); g.classList.add('open'); }
}

function copiaLinkOrdine(btn){
  const url = location.origin + "/tracking.html?ordine=" + _codiceCorrente;
  const ok = () => { btn.textContent = "✓ Link copiato!"; setTimeout(()=>btn.textContent="📋 Copia link", 2000); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(ok).catch(()=>{ prompt("Copia il link:", url); });
  } else {
    prompt("Copia il link:", url);
  }
}

function bloccoAvvisami(cod){
  if(!('serviceWorker' in navigator)) return "";
  // Su iPhone il supporto alle notifiche (PushManager) compare SOLO dopo che il
  // sito è stato aggiunto alla schermata Home: se nascondessimo il blocco qui,
  // il cliente non vedrebbe mai le istruzioni per arrivarci (31/08/26).
  if(!('PushManager' in window) && !isiOS) return "";
  return `<div class="avvisami">
    <div class="avvisami-top">
      <div class="avvisami-emoji">🔔</div>
      <div class="avvisami-txt"><div class="avvisami-tit">Avvisami quando il pacco si muove</div></div>
      <button class="avvisami-btn" id="btnAvvisami" onclick="attivaAvvisi()">Attiva</button>
    </div>
    <div class="avvisami-guida"></div>
  </div>`;
}

async function statoAvvisi(){
  const btn = document.getElementById('btnAvvisami');
  if(!btn) return;
  try{
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub && Notification.permission === 'granted'){
      btn.textContent = '✓ Attive';
      btn.classList.add('attivo');
    }
  }catch(e){}
}

async function attivaAvvisi(){
  const btn = document.getElementById('btnAvvisami');
  const guida = document.querySelector('.avvisami-guida');
  if(!btn) return;

  // Già attivi → spegnili
  if(btn.classList.contains('attivo')){
    try{
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && await reg.pushManager.getSubscription();
      if(sub){
        await fetch(API_NOTIFICHE + "/unsub", {method:"POST",
          headers:{"Content-Type":"application/json"}, body: JSON.stringify({endpoint: sub.endpoint})}).catch(()=>{});
        await sub.unsubscribe();
      }
    }catch(e){}
    btn.textContent = 'Attiva'; btn.classList.remove('attivo');
    return;
  }

  // Su iPhone non si può attivare da qui: prima serve l'icona creata da Safari
  if(isiOS && !installata){ mostraGuida(iosNonSafari ? "chromeIos" : "safari"); return; }

  btn.disabled = true; btn.textContent = 'Attendi…';
  try{
    const permesso = await Notification.requestPermission();
    if(permesso !== 'granted'){
      btn.disabled = false; btn.textContent = 'Attiva';
      guida.classList.add('open');
      guida.innerHTML = "<b>Permesso negato.</b> Per riattivarlo vai nelle impostazioni del browser, alla voce Notifiche per questo sito, e scegli «Consenti».";
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToUint8(CHIAVE_PUSH),
    });
    const r = await fetch(API_NOTIFICHE + "/sub", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({codice: _codiceCorrente, subscription: sub.toJSON()}),
    });
    if(!r.ok) throw new Error("registrazione non riuscita");
    btn.disabled = false; btn.textContent = '✓ Attive'; btn.classList.add('attivo');
  }catch(e){
    btn.disabled = false; btn.textContent = 'Attiva';
    guida.classList.add('open');
    guida.innerHTML = "<b>Non è stato possibile attivare gli avvisi.</b> Riprova fra poco, oppure scrivici su WhatsApp e ti aggiorniamo noi."
      + `<div style="margin-top:8px;font-size:11px;opacity:.6">Dettaglio tecnico: ${String(e && e.message || e).slice(0,120)}</div>`;
  }
}

function toggleGlossario(el){
  const body = el.nextElementSibling;
  const open = body.classList.toggle("open");
  el.setAttribute("aria-expanded", open);
}

/* Glossario: elenco completo delle voci possibili, in ordine cronologico del
   viaggio. Ognuna ha le parole chiave con cui riconoscerla negli eventi reali:
   la legenda mostra SOLO le voci che il cliente vede davvero nel suo tracking,
   così non legge spiegazioni di passaggi non ancora avvenuti. */

  {icon:"📦", term:"Arrivato al punto di raccolta",
   desc:"Il tuo pacco è stato ritirato e registrato presso il centro di smistamento del corriere.",
   key:["punto di raccolta","pacco ritirato","ordine registrato","dati della spedizione"]},
  {icon:"🏭", term:"Pacco in uscita dal centro operativo",
   desc:"Il pacco ha lasciato il magazzino ed è in movimento verso il prossimo hub.",
   key:["centro operativo","uscito dal magazzino","entrato in magazzino","centro di smistamento"]},
  {icon:"✈️", term:"Uscito dal magazzino, in attesa del volo",
   desc:"Il pacco è pronto per essere caricato sull'aereo. I voli internazionali vengono assegnati in base alla disponibilità.",
   key:["attesa del volo","in attesa del volo","caricato sull'aereo","compagnia aerea"]},
  {icon:"🛫", term:"Partito dall'aeroporto di origine",
   desc:"Il pacco è in volo verso l'Italia.",
   key:["aeroporto di origine","volo partito","partenza prevista"]},
  {icon:"🛬", term:"Volo atterrato",
   desc:"L'aereo è atterrato. Il pacco passerà ora ai controlli doganali.",
   key:["volo atterrato","aeroporto di destinazione","aeroporto locale","arrivo previsto"]},
  {icon:"🔎", term:"Sdoganamento in corso / completato",
   desc:"Il pacco viene controllato dalla dogana italiana. È un passaggio obbligatorio per tutti i pacchi internazionali e può richiedere 1–3 giorni.",
   key:["sdoganamento","dogana","deposito doganale"]},
  {icon:"📮", term:"Il tuo pacco è in fase di presa in carico da Poste Italiane",
   desc:"Il pacco è arrivato e Poste Italiane lo sta registrando nel proprio sistema. A breve sarà disponibile il tracking italiano.",
   key:["corriere locale","prima scansione","presa in carico","affidato"]},
  {icon:"🚚", term:"In transito nella rete di Poste Italiane",
   desc:"Il pacco si sta spostando tra gli hub postali italiani verso la tua città.",
   key:["in transito","rete di poste"]},
  {icon:"🏡", term:"In consegna",

function aggiornaGlossario(o){
  const box  = document.querySelector(".glossario");
  const body = document.querySelector(".glossario-body");
  if(!box || !body) return;
  const testi = [...(o?.eventi_corriere||[]), ...(o?.eventi_cina||[])]
    .map(e => (e.stato||"").toLowerCase());
  const voci = GLOSSARIO.filter(g => testi.some(t => g.key.some(k => t.includes(k))));
  if(!voci.length){ box.style.display = "none"; return; }
  box.style.display = "";
  body.innerHTML = voci.map(g =>
    `<div class="gl-row"><div class="gl-icon">${g.icon}</div><div>
       <div class="gl-term">${g.term}</div><div class="gl-desc">${g.desc}</div>
     </div></div>`).join("");
}

// deeplink ?ordine=CSC-2026-0274
// L'icona aggiunta alla schermata Home apre /tracking.html SENZA il codice
// ordine: ricordiamo l'ultimo cercato, così il cliente ritrova subito il suo
// pacco invece di dover riscrivere il codice ogni volta.
const RICORDA = "csc_ultimo_ordine";
const p = new URLSearchParams(location.search);
const pre = p.get("ordine") || (()=>{ try{ return localStorage.getItem(RICORDA); }catch(e){ return null; } })();
if(pre){ document.getElementById("inp").value=pre; cerca(); }
else if(installata){
  // Aperta dall'icona ma senza codice: iPhone tiene la memoria dell'app
  // separata da quella di Safari, quindi il codice cercato prima nel browser
  // qui non c'è. Si inserisce una volta e da lì in poi resta salvato.
  document.getElementById("benvenutoApp").innerHTML =
    `<div style="border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:rgba(37,99,235,.06);
       font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:8px">
       👋 <b style="color:var(--text)">Benvenuto!</b> Inserisci qui sopra il codice del tuo ordine
       (lo trovi nel messaggio WhatsApp). <b style="color:var(--text)">Te lo ricordiamo noi</b>:
       le prossime volte si aprirà da solo.
     </div>`;
}
