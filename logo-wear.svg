<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 210" width="300" height="210">
  <!-- CSC Wear — logo esteso. Oro piatto #D9B45A, nessun rilievo: è la
       grammatica dei marchi di moda, non delle medaglie. -->
  <text x="150" y="86" text-anchor="middle" fill="#D9B45A"
        font-family="Cormorant Garamond, Cormorant, Garamond, Times New Roman, serif"
        font-size="80" font-weight="400" letter-spacing="17" dx="8.5">CSC</text>
  <line x1="98" y1="114" x2="202" y2="114" stroke="#D9B45A" stroke-width="1"/>
  <text x="150" y="145" text-anchor="middle" fill="#D9B45A"
        font-family="Jost, Futura, Helvetica Neue, Arial, sans-serif"
        font-size="20" font-weight="300" letter-spacing="9" dx="4.5">2.0</text>
  <text x="150" y="178" text-anchor="middle" fill="#D9B45A"
        font-family="Jost, Futura, Helvetica Neue, Arial, sans-serif"
        font-size="11.5" font-weight="300" letter-spacing="8" dx="4" opacity=".85">WEAR</text>
</svg>
